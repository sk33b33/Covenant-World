<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Covenant World — zone test client</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11151c;
        --panel: #1b2029;
        --text: #e6e9ef;
        --muted: #8b95a7;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 16px; font-weight: 600; margin: 0; }
      #hud {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
        justify-content: center;
        padding: 8px 14px;
        background: var(--panel);
        border-radius: 8px;
        max-width: 100%;
      }
      #hud span { white-space: nowrap; }
      .muted { color: var(--muted); }
      canvas {
        background: #26301f;
        border-radius: 8px;
        max-width: 100%;
        touch-action: none;
      }
      footer { color: var(--muted); text-align: center; }
      #stage-wrap { position: relative; }
      #prompt {
        position: absolute;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        padding: 6px 12px;
        border-radius: 6px;
        background: rgba(17, 21, 28, 0.85);
        white-space: nowrap;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        text-align: center;
        background: rgba(17, 21, 28, 0.82);
        border-radius: 8px;
      }
      #overlay strong { font-size: 18px; }
      #overlay .keys { color: var(--muted); }
      [hidden] { display: none !important; }
      /* Name tags and landmark labels are plain DOM, positioned each frame
         from the 3D scene's camera projection — crisper than a texture, and
         it keeps the WebGL canvas itself free of 2D text draws. */
      #labels {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .label {
        position: absolute;
        transform: translate(-50%, -100%);
        font: 600 11px ui-sans-serif, system-ui, sans-serif;
        white-space: nowrap;
        text-shadow: 0 0 3px rgba(0, 0, 0, 0.9), 0 0 3px rgba(0, 0, 0, 0.9);
        color: #fff;
      }
      .label.self { color: #ffe08a; }
      .label.landmark { color: #f2e6c9; bottom: auto; }
      /* A soft frame around the scene — cheaper and crisper than a shader pass. */
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.4) 100%);
      }
    </style>
  </head>
  <body>
    <h1>Covenant World — zone test client</h1>
    <div id="hud">
      <span id="status">connecting…</span>
      <span id="population" class="muted"></span>
      <span id="room" class="muted"></span>
    </div>
    <div id="stage-wrap">
      <canvas id="stage" width="800" height="600"></canvas>
      <div id="labels"></div>
      <div id="vignette"></div>
      <div id="prompt" hidden></div>
      <div id="overlay" hidden></div>
    </div>
    <footer class="muted">
      WASD or arrow keys to walk, <kbd>E</kbd> to challenge a player you're standing next to.
      Walk off the east edge to cross into the next zone. Open a second tab to see
      another player. Add <code>?name=Ash</code> to pick a name.
    </footer>
    <script src="/vendor/colyseus.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="/main.js"></script>
  </body>
</html>
